name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (flasher, data-pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests -r flasher/requirements.txt
      - name: pytest
        run: pytest data-pipeline flasher

  firmware:
    name: Firmware (ESP8266)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: PlatformIO und Generatoren installieren
        run: pip install platformio pillow cryptography
      - name: Logo, Web-Assets und Standardzertifikat erzeugen
        run: |
          python tools/make_logo.py
          python tools/embed_web.py
          python tools/make_default_cert.py
      - name: Firmware bauen
        env:
          # YAML-Einfachanführungszeichen: die Backslashes bleiben erhalten, PlatformIO/SCons
          # parst \" zu " und das Makro wird ein C-String-Literal.
          PLATFORMIO_BUILD_FLAGS: '-DDATA_URL=\"https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/\"'
        run: pio run -d firmware
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/.pio/build/nodemcuv2/firmware.bin
          if-no-files-found: error

  flasher:
    name: Flasher (Windows)
    needs: firmware
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: flasher
      - name: Abhängigkeiten installieren
        run: pip install -r flasher/requirements.txt pyinstaller
      - name: EXE bauen
        run: >-
          pyinstaller --onefile --windowed --noconfirm --clean
          --name WoWScannerFlasher
          --add-data "flasher/firmware.bin;."
          --paths flasher
          --collect-submodules esptool
          --collect-submodules serial
          flasher/flasher.py
      - name: Artefakte sammeln
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/WoWScannerFlasher.exe release/
          Copy-Item flasher/firmware.bin release/
      - uses: actions/upload-artifact@v4
        with:
          name: WoWScannerFlasher
          path: release/
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [test, flasher]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WoWScannerFlasher
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/WoWScannerFlasher.exe
            release/firmware.bin
