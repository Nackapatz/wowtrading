; WoW Trading Card Price Scanner - ESP8266 firmware
;
; Build:   pio run -d firmware
; Flash:   pio run -d firmware -t upload
; OTA:     pio run -d firmware -t upload --upload-port <ip> (ArduinoOTA, password = otaPass)
;
; Build-time overrides go through the environment, e.g. in CI:
;   PLATFORMIO_BUILD_FLAGS="-DDATA_URL=\"https://me.github.io/repo/data/\" -DFW_VERSION=\"1.2.3\""
; Flags from the environment are appended after build_flags, so they win.

[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
; Platform 4.2.x ships the Arduino-ESP8266 core 3.1.x (confirm with pio pkg list).
platform = espressif8266 @ ~4.2.0
board = nodemcuv2
framework = arduino

; 4 MB flash, 1 MB LittleFS, OTA-capable layout (OTA only replaces the sketch area).
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld

lib_deps =
    olikraus/U8g2
    bblanchon/ArduinoJson @ ^7

build_flags =
    -DFW_VERSION=\"0.1.11\"
    -DDATA_URL=\"https://nackapatz.github.io/wowtrading/data/\"

; Generates include/web_assets.h, include/logo.h and include/default_cert.h when
; they are missing (or the web app changed). See scripts/pre_build.py.
extra_scripts = pre:scripts/pre_build.py

monitor_speed = 115200
upload_speed = 460800
